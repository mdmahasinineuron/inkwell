<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- ───────── notebooks rail ───────── -->
  <aside class="rail">
    <div class="brand"><span class="nib">✒</span> Inkwell</div>
    <div class="rail-head">
      <span>Notebooks</span>
      <button class="ghost" id="add-notebook" title="New notebook">+</button>
    </div>
    <div id="notebook-list" class="notebook-list"></div>
    <div class="rail-foot">
      <div class="presence" id="presence" title="Devices connected right now">● 1 device</div>
      <button class="ghost" id="logout">Sign out</button>
    </div>
    <div class="rz" id="rz-rail" title="Drag to resize"></div>
  </aside>

  <!-- ───────── notes column ───────── -->
  <section class="notes-col">
    <div class="notes-head">
      <input id="search" placeholder="Search notes…" spellcheck="false">
      <button id="add-note" class="primary">+ Note</button>
    </div>
    <div id="note-list" class="note-list"></div>
    <div class="rz" id="rz-notes" title="Drag to resize"></div>
  </section>

  <!-- ───────── editor + paper ───────── -->
  <main class="work">
    <div class="toolbar">
      <button id="btn-drawer" title="Notebooks and notes">☰</button>
      <input id="title" placeholder="Untitled note" spellcheck="false">
      <div class="tool-actions">
        <button id="btn-view" title="Switch between writing and the page">¶ Write</button>
        <button id="btn-pagemode" title="Page style: A4 pages / infinite scroll">📄 A4</button>
        <button id="btn-paper" title="Page colour and paper — change it any time">🎨 Paper</button>
        <button id="btn-code" title="Insert code block (Ctrl+Shift+K)">{ } Code block</button>
        <button id="btn-ink" title="Draw over the note">✎ Ink</button>
        <button id="btn-image" title="Insert an image — or just paste one with Ctrl+V">🖼 Image</button>
        <button id="btn-export" title="Download as Markdown">.md</button>
        <button id="btn-pdf" title="Export as PDF (A4)">PDF</button>
        <button id="btn-delete" class="danger" title="Delete note">Delete</button>
      </div>
    </div>

    <!-- OneNote-style Draw ribbon: docks under the toolbar while Ink is on -->
    <div class="pen-tray" id="pen-tray" hidden>
      <div class="ribbon-group">
        <button id="ink-undo" class="ribbon-btn" title="Undo (Ctrl+Z)">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3.5 7.5 7 11"/><path d="M3.5 7.5H12a4.5 4.5 0 0 1 0 9H8"/></svg>
        </button>
        <button id="ink-redo" class="ribbon-btn" title="Redo (Ctrl+Y)">
          <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4l3.5 3.5L13 11"/><path d="M16.5 7.5H8a4.5 4.5 0 0 0 0 9h4"/></svg>
        </button>
      </div>
      <div class="tray-sep"></div>
      <button id="tool-eraser" class="ribbon-btn labeled" title="Eraser — removes whole strokes">
        <svg viewBox="0 0 22 22" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M8.5 18.5 3.6 13.6a2 2 0 0 1 0-2.8l7.2-7.2a2 2 0 0 1 2.8 0l4.8 4.8a2 2 0 0 1 0 2.8l-7.3 7.3z"/><path d="M6.5 8.9l6.6 6.6"/><path d="M8.5 18.5H19"/></svg>
        <span>Eraser</span>
      </button>
      <div class="tray-sep"></div>
      <div class="pen-gallery" id="pen-gallery"></div>
      <div class="tray-sep"></div>
      <button id="palm" class="ribbon-btn labeled on" title="Palm rejection: ignore finger touches">
        <svg viewBox="0 0 22 22" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V5.5a1.5 1.5 0 0 1 3 0V10m0-4.5v-1a1.5 1.5 0 0 1 3 0V10m0-3.5a1.5 1.5 0 0 1 3 0V12m0-1a1.5 1.5 0 0 1 3 0v3.2A6.8 6.8 0 0 1 12.2 21h-1.4a6.8 6.8 0 0 1-5.6-2.9L3 14.6a1.6 1.6 0 0 1 2.5-2L7 14.5"/></svg>
        <span>Palm</span>
      </button>
      <div class="pressure" id="pressure-readout">pressure —</div>
    </div>

    <!-- Thickness + ink colors popup for the selected pen -->
    <div class="pen-pop" id="pen-pop" hidden>
      <div class="pop-title">Thickness</div>
      <div class="thick-row" id="thick-row"></div>
      <div class="pop-title">Ink Colors</div>
      <div class="color-grid" id="color-grid"></div>
    </div>

    <!-- Page colour + paper popup: opens from 🎨 Paper, at any point while
         writing — the page recolours under the words without touching them -->
    <div class="pen-pop paper-pop" id="paper-pop" hidden>
      <div class="pop-title">Page Colour</div>
      <div class="color-grid" id="paper-grid"></div>
      <div class="pop-title">Paper</div>
      <div class="thick-row" id="paper-pattern"></div>
    </div>

    <div class="panes" id="panes">
      <textarea id="editor" placeholder="Write Markdown here…" spellcheck="false"></textarea>

      <div class="rz" id="rz-panes" title="Drag to resize"></div>
      <div class="paper-scroll" id="paper-scroll">
        <!-- .paper-fit is the layout box; .paper inside it keeps its true page
             size (820 logical px) and is scaled to fit, so the page looks and
             measures the same on every device. -->
        <div class="paper-fit" id="paper-fit">
          <div class="paper" id="paper">
            <!-- pictures parked behind the text (see .img-layer in the CSS) -->
            <div class="img-layer back" id="img-layer-back"></div>
            <!-- highlighter ink lives *under* the words, the way a real marker
                 does: it colours the paper, it never touches the letters -->
            <canvas id="hl-canvas"></canvas>
            <div class="rendered" id="rendered"></div>
            <!-- pasted/dropped pictures: positioned in page coordinates, so the
                 whole layer scales with the page and never drifts on zoom -->
            <div class="img-layer" id="img-layer"></div>
            <canvas id="ink-canvas"></canvas>

            <!-- floating bar for the selected picture -->
            <div class="img-toolbar" id="img-toolbar" hidden>
              <button id="im-copy" title="Copy picture (Ctrl+C)">Copy</button>
              <button id="im-dupe" title="Duplicate (Ctrl+D)">Duplicate</button>
              <span class="tt-sep"></span>
              <button id="im-smaller" title="Shrink 10%">−</button>
              <button id="im-fit" title="Fit to the page width">Fit</button>
              <button id="im-bigger" title="Grow 10%">+</button>
              <span class="tt-sep"></span>
              <button id="im-front" title="Send behind / bring in front of the text">Behind</button>
              <button id="im-delete" class="im-danger" title="Delete picture (Del)">Delete</button>
            </div>
            <!-- floating format bar for inline editing on the paper -->
            <div class="text-toolbar" id="text-toolbar" hidden>
              <div class="tt-row">
                <select id="tt-block" title="Paragraph style">
                  <option value="p">Paragraph</option>
                  <option value="h1">Heading 1</option>
                  <option value="h2">Heading 2</option>
                  <option value="h3">Heading 3</option>
                  <option value="h4">Heading 4</option>
                  <option value="ul">Bullet list</option>
                  <option value="ol">Numbered list</option>
                  <option value="blockquote">Quote</option>
                </select>
                <span class="tt-sep"></span>
                <button id="tt-bold" title="Bold (Ctrl+B)"><b>B</b></button>
                <button id="tt-italic" title="Italic (Ctrl+I)"><i>I</i></button>
                <button id="tt-underline" title="Underline (Ctrl+U)"><u>U</u></button>
                <button id="tt-strike" title="Strikethrough"><s>S</s></button>
                <button id="tt-code" title="Inline code" class="tt-mono">&lt;/&gt;</button>
                <button id="tt-link" title="Link (Ctrl+K)"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6.6 9.4a3 3 0 0 0 4.3 0l2-2a3 3 0 0 0-4.3-4.3l-1 1"/><path d="M9.4 6.6a3 3 0 0 0-4.3 0l-2 2a3 3 0 0 0 4.3 4.3l1-1"/></svg></button>
                <span class="tt-sep"></span>
                <button id="tt-smaller" title="Smaller text">A−</button>
                <button id="tt-bigger" title="Larger text">A+</button>
              </div>
              <div class="tt-row">
                <button id="tt-color" class="tt-swatchbtn" title="Text colour">A<i id="tt-color-dot"></i></button>
                <button id="tt-highlight" class="tt-swatchbtn" title="Highlight">▮<i id="tt-hl-dot"></i></button>
                <span class="tt-sep"></span>
                <button id="tt-align-left" title="Align left"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 3.5h12M2 7h7M2 10.5h12M2 14h7"/></svg></button>
                <button id="tt-align-center" title="Centre"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 3.5h12M4.5 7h7M2 10.5h12M4.5 14h7"/></svg></button>
                <button id="tt-align-right" title="Align right"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 3.5h12M7 7h7M2 10.5h12M7 14h7"/></svg></button>
                <span class="tt-sep"></span>
                <button id="tt-clear" title="Clear formatting"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 3h7M6 3.4v9.2"/><path d="M10 8.2l4.4 4.4M14.4 8.2L10 12.6"/></svg></button>
                <button id="tt-done" class="tt-done" title="Done (Esc)">✓ Done</button>
              </div>
              <div class="tt-palette" id="tt-palette" hidden></div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- ───────── new note: page style chooser ───────── -->
<div class="overlay" id="newnote-overlay" hidden>
  <div class="dialog small">
    <div class="dialog-head">
      <span>New note — choose a page style</span>
      <button class="ghost" id="newnote-cancel">✕</button>
    </div>
    <div class="page-choices">
      <button class="page-choice" id="choose-a4">
        <span class="pc-icon">📄</span>
        <span class="pc-name">A4 pages</span>
        <span class="pc-desc">Traditional document. New pages are added automatically as you reach the end, and you can insert a blank page between any two pages later.</span>
      </button>
      <button class="page-choice" id="choose-infinite">
        <span class="pc-icon">∞</span>
        <span class="pc-name">Infinite scroll</span>
        <span class="pc-desc">One endless sheet that simply grows as you write — no page boundaries.</span>
      </button>
    </div>
  </div>
</div>

<!-- ───────── delete notebook dialog ───────── -->
<div class="overlay" id="nbdel-overlay" hidden>
  <div class="dialog small">
    <div class="dialog-head">
      <span>Delete notebook</span>
      <button class="ghost" id="nbdel-x">✕</button>
    </div>
    <p class="dialog-text" id="nbdel-text"></p>
    <div class="dialog-foot">
      <button id="nbdel-cancel">Cancel</button>
      <button id="nbdel-keep">Keep the notes</button>
      <button id="nbdel-all" class="danger">Delete notes too</button>
    </div>
  </div>
</div>

<!-- ───────── code block dialog ───────── -->
<div id="drawer-backdrop"></div>
<div class="overlay" id="code-overlay" hidden>
  <div class="dialog">
    <div class="dialog-head">
      <span>Insert code block</span>
      <button class="ghost" id="code-cancel-x">✕</button>
    </div>
    <label class="dialog-label" for="code-lang">Language</label>
    <select id="code-lang"></select>
    <label class="dialog-label" for="code-text">Code</label>
    <textarea id="code-text" placeholder="Paste your snippet — multi-line is fine" spellcheck="false"></textarea>
    <div class="dialog-foot">
      <button id="code-cancel">Cancel</button>
      <button id="code-insert" class="primary">Insert</button>
    </div>
  </div>
</div>

<input type="file" id="image-file" accept="image/*" multiple hidden>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="app.js"></script>
</body>
</html>
